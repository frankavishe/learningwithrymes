version: '3.8'
services:
  mysql_db:
    image: mysql:8.0
    container_name: rhythm_notes_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_db_password
      MYSQL_DATABASE: rhythm_notes
      MYSQL_USER: rhythm_app_user
      MYSQL_PASSWORD: app_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: rhythm_notes_pma
    restart: always
    links:
      - mysql_db:db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: root_db_password

  redis:
    image: redis:7-alpine
    container_name: rhythm_notes_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Phase 6 (STORAGE-001) — self-hosted, dev-friendly S3-compatible object storage for generated
  # audio, matching the docker-compose pattern already used for mysql_db/redis. The app's
  # StorageService talks to it over the S3 API, so swapping to AWS S3 in prod is an env-var change
  # only (specs/06-audio-storage.md Open Questions).
  minio:
    image: minio/minio
    container_name: rhythm_notes_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rhythm_minio_admin
      MINIO_ROOT_PASSWORD: rhythm_minio_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  redis_data:
  minio_data:
